<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Dashboard </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="logo-icon">🌻</span> Sunflower
            </div>


            <div class="team-placeholder">
                <h3>📅 [달력]</h3>
                <p>달력 및 7일 요약 위젯 구현 영역</p>
            </div>
            <button class="btn-add-global" onclick="app.openModal()">＋ Add Task</button>
        </aside>

        <div class="main-content">
            <header class="main-header">
                <div class="nav-tabs">
                    <span class="tab-item active">To-Do List</span>
                    <span class="tab-item inactive" style="color:#ccc;">Sunflower (C파트)</span>
                </div>
                <div class="header-widgets">
                    <div class="widget-coin">💰 <span id="coin-count">0</span></div>

                    <!-- D-day 위젯 추가 -->
                    <div class="widget-dday" id="dday-widget">
                    <span class="dday-icon">📌</span>
                    <div class="dday-info" id="dday-info">
                        <span class="dday-label">D-Day 설정</span>
                    </div>
                    <button class="dday-set-btn" id="dday-set-btn" title="D-Day 설정">＋</button>
                </div>
                </div>
            </header>

            <!-- D-day 설정 -->
        <div class="dday-dropdown" id="dday-dropdown">
            <div class="dday-form">
                <div class="form-group">
                    <label>이름</label>
                    <input type="text" id="dday-name-input" placeholder="예: 기말고사">
                </div>
                <div class="form-group">
                    <label>날짜</label>
                    <input type="date" id="dday-date-input">
                </div>
                <div class="dday-form-actions">
                    <button class="btn-action secondary" id="dday-cancel-btn">취소</button>
                    <button class="btn-action primary" id="dday-save-btn">저장</button>
                </div>
                <div class="dday-list" id="dday-list"></div>
            </div>
        </div>


            <div id="view-todo" class="tab-view active">

            <!-- ===== URGENT BANNERS (D-10 노란색, D-7 빨간색) ===== -->
            <section class="urgent-banners" id="urgent-banners">
                <!-- 동적으로 렌더링 -->
            </section>

            <!-- ===== FILTER BAR ===== -->
            <section class="filter-control-bar">
                <!-- 왼쪽: 상태탭 + 추가버튼 -->
                <div class="filter-left">
                    <div class="sub-status-tabs">
                        <span class="sub-tab active" onclick="app.setFilterStatus('전체')">To-Do</span>
                        <span class="sub-tab" onclick="app.setFilterStatus('진행 중')">In Progress</span>
                        <span class="sub-tab" onclick="app.setFilterStatus('완료')">Done</span>
                    </div>
                    <!-- 일정 추가 버튼 (filter bar 왼쪽) -->
                    <button class="btn-add-task-inline" onclick="app.openModal()">＋ 일정 추가</button>
                </div>

                <!-- 오른쪽: 카테고리 + Edit 버튼 -->
                <div class="filter-right">
                    <select id="filter-category" onchange="app.render()">
                        <option value="all">All Categories</option>
                        <option value="study">학업</option>
                        <option value="personal">개인</option>
                        <option value="team">팀플</option>
                        <option value="work">업무</option>
                    </select>
                    <button class="btn-edit-mode" id="btn-edit-mode" onclick="app.toggleEditMode()">✏️ Edit</button>
                </div>
            </section>

             <!-- Edit 모드 액션 바 -->
            <div class="edit-action-bar" id="edit-action-bar" style="display:none;">
                <span class="selected-count-label"><span id="selected-count">0</span>개 선택됨</span>
                <button class="btn-postpone" id="btn-postpone" onclick="app.openPostponeModal()">📅 미루기</button>
                <button class="btn-cancel-edit" onclick="app.toggleEditMode()">취소</button>
            </div>

                <section class="task-priority-groups">
                    <div class="priority-block">
                        <div class="priority-title high">🔥 중요도⭐⭐⭐</div>
                        <ul id="list-high" class="task-list-ul"></ul>
                    </div>
                    <div class="priority-block">
                        <div class="priority-title medium">⚡ 중요도 ⭐⭐y</div>
                        <ul id="list-medium" class="task-list-ul"></ul>
                    </div>
                    <div class="priority-block">
                        <div class="priority-title low">🔽 중요도⭐</div>
                        <ul id="list-low" class="task-list-ul"></ul>
                    </div>
                </section>
            </div>

            <div id="view-sunflower" class="tab-view" style="display:none;">
                <div class="team-placeholder" style="height: 400px;">
                    <h3>🌻 [C 파트 담당]</h3>
                    <p>해바라기 룸, 상점, 옷장, 로그 구현 영역</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 일정 추가/ 편집 UI -->
    <div id="task-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">📝 일정 추가</h3>
                <button class="close-modal-btn" onclick="app.closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="task-title" placeholder="할 일 작성">
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:1;">
                        <label>Due Date</label>
                        <input type="date" id="task-date">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Priority</label>
                        <select id="task-priority">
                            <option value="high">High</option>
                            <option value="medium" selected>Middle</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="task-category">
                        <option value="study">학업</option>
                        <option value="personal">개인</option>
                        <option value="team">팀플</option>
                        <option value="work">업무</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-action secondary" onclick="app.closeModal()">Cancel</button>
                <button class="btn-action primary" onclick="app.saveTask()">Save Task</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
