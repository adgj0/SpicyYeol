<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날짜별 투두리스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-shell">
    <section class="calendar-panel" aria-label="달력">
        <div class="panel-heading">
            <button class="icon-button" id="prevMonth" type="button" aria-label="이전 달">‹</button>
            <h1 id="currentMonth">2026년 6월</h1>
            <button class="icon-button" id="nextMonth" type="button" aria-label="다음 달">›</button>
        </div>

        <div class="weekday-grid" aria-hidden="true">
            <span>일</span>
            <span>월</span>
            <span>화</span>
            <span>수</span>
            <span>목</span>
            <span>금</span>
            <span>토</span>
        </div>
        <div class="postpone-guide" id="postponeGuide" role="status" aria-live="polite">
            <strong>미룰 날짜를 선택하세요</strong>
            <span>달력에서 원하는 날짜를 누르면 할 일이 그 날짜로 이동합니다.</span>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="calendar-journal-panel" id="calendarJournalPanel" aria-live="polite"></div>
        <div class="calendar-task-panel" aria-label="작업 판넬">
            <button class="journal-button" type="button">일기쓰기</button>
        </div>
    </section>

    <section class="todo-panel" aria-label="투두리스트">
        <div class="selected-date">
            <p>선택한 날짜</p>
            <h2 id="selectedDateLabel"></h2>
        </div>

        <form class="todo-form" id="todoForm">
            <input id="todoInput" type="text" placeholder="할 일을 입력하세요" autocomplete="off" required>
            <button type="submit">추가</button>
        </form>

        <section class="todo-list-section" aria-label="선택 날짜의 할 일">
            <div class="section-title">
                <h3>오늘의 체크리스트</h3>
                <div style="display:flex; align-items:center; gap:8px;">
                    <button type="button" id="trashBtn" class="trash-btn" title="삭제 기록 보기" aria-label="삭제 기록 보기">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                        </svg>
                    </button>
                    <span id="todoCount">0개</span>
                </div>
            </div>

            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="all">전체</button>
                <button class="filter-tab" data-filter="pending">진행 전</button>
                <button class="filter-tab" data-filter="in-progress">진행 중</button>
                <button class="filter-tab" data-filter="completed">완료</button>
            </div>

            <div class="priority-groups" id="priorityGroupsContainer">
                <div class="group-urgent">
                    <h4 style="color: #cc0000; margin-bottom: 8px; font-weight: 800;">[위급]</h4>
                    <ul class="todo-list" id="todoListUrgent"></ul>
                    </div>
                <div class="group-high">
                    <h4 style="color: #bc000a; margin-bottom: 8px;">[중요]</h4>
                    <ul class="todo-list" id="todoListHigh"></ul>
                </div>
                <div class="group-medium" style="margin-top: 16px;">
                    <h4 style="color: #705d00; margin-bottom: 8px;">[보통]</h4>
                    <ul class="todo-list" id="todoListMedium"></ul>
                </div>
                <div class="group-low" style="margin-top: 16px;">
                    <h4 style="color: #006b25; margin-bottom: 8px;">[일반]</h4>
                    <ul class="todo-list" id="todoListLow"></ul>
                </div>
            </div>

            <p class="empty-state" id="emptyState">이 날짜에는 아직 할 일이 없습니다.</p>
        </section>

            <section class="sunflower-section" aria-label="해바라기 키우기">
                <div>
                    <h3>해바라기 키우기</h3>
                    <button onclick="SunflowerPanel.open()" style="margin-top:8px;padding:6px 12px;background:#1D9E75;color:white;border:none;border-radius:8px;cursor:pointer;font-size:12px;">🌻 해바라기 보기</button>
                    <p id="sunflowerMessage">할 일을 완료하면 해바라기가 자랍니다.</p>
                    <div id="fertGauge" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px"></div>
                </div>
                <div class="sunflower-garden" id="sunflowerGarden"></div>
            </section>
        </section>
    </main>

    <div id="todoModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3 id="modalTitle">일정 추가</h3>
            <input type="text" id="modalTextInput" placeholder="할 일 제목을 입력하세요">

            <div class="modal-field">
                <label>❗중요도❗</label>
                <select id="modalPriority">
                    <option value="high">높음</option>
                    <option value="medium" selected>중간</option>
                    <option value="low">낮음</option>
                </select>
            </div>

            <div class="modal-field">
                <label>📁 카테고리</label>
                <select id="modalCategory">
                    <option value="study">학업</option>
                    <option value="personal" selected>개인</option>
                    <option value="team">팀플</option>
                    <option value="work">업무</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" id="modalCancelBtn" class="cancel-btn">취소</button>
                <button type="button" id="modalSaveBtn" class="save-btn">저장</button>
            </div>
        </div>
    </div>
    <div id="trashModal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h3>🗑 삭제된 일정</h3>
            <ul id="trashList" class="trash-list"></ul>
            <p id="trashEmpty" style="display:none; color:#888; text-align:center; margin:16px 0;">삭제된 일정이 없습니다.</p>
            <div class="modal-actions">
                <button type="button" id="trashCloseBtn" class="cancel-btn">닫기</button>
            </div>
        </div>
    </div>

    <script src="sunflower/sunflowerConstants.js"></script>
    <script src="sunflower/sunflowerDrawUtils.js"></script>
    <script src="sunflower/SunflowerCanvas.js"></script>
    <script src="sunflower/SunflowerState.js"></script>
    <script src="sunflower/SunflowerNavIcon.js"></script>
    <script src="sunflower/SunflowerPanel.js"></script>
    <script src="script.js"></script>
</body>
</html>
